# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Updated: Use recursive search (**) to ensure we find the files
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-usb"
BBFILE_PATTERN_meta-usb = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-usb = "6"

LAYERSERIES_COMPAT_meta-usb = "scarthgap walnascar"

LAYERDEPENDS_meta-usb = "core"

